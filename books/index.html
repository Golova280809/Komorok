<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" href="../logo.png">
    <link rel="icon" type="image/png" href="../logo.png">

    <meta name="description" content="Kompanion — библиотека школьных учебников на Komorok. Учебники по классам и предметам.">
    <meta name="keywords" content="учебники, школьные учебники, PDF, библиотека, Komorok">
    <link rel="canonical" href="https://komorok.ru/books/">

    <meta property="og:title" content="Kompanion — библиотека учебников | Komorok">
    <meta property="og:description" content="Школьные учебники по классам и предметам. Читай онлайн на Komorok.">
    <meta property="og:url" content="https://komorok.ru/books/">
    <meta property="og:image" content="https://komorok.ru/logo.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Komorok">

    <script>
        (function() {
            var theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark-theme');
            }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="../style.css">
    <title>Kompanion — библиотека учебников | Komorok</title>
    <style>
        .class-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 28px;
        }
        .class-card {
            background: #0f3460;
            border: 1px solid #a8dadc;
            border-radius: 14px;
            padding: 20px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            color: #f1faee;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            display: block;
        }
        .class-card:hover, .class-card.active {
            background: #e63946;
            border-color: #e63946;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(230, 57, 70, 0.3);
        }
        .class-card .class-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
        }

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 28px;
        }
        .subject-card {
            background: #1a1a2e;
            border: 1px solid #a8dadc;
            border-radius: 10px;
            padding: 12px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            color: #a8dadc;
            font-size: 14px;
            font-weight: bold;
        }
        .subject-card:hover, .subject-card.active {
            background: #e63946;
            color: #fff;
            border-color: #e63946;
        }
        .subject-card .subj-icon {
            font-size: 28px;
            display: block;
            margin-bottom: 4px;
        }

        .breadcrumbs {
            text-align: center;
            margin-bottom: 20px;
            color: #a8dadc;
            font-size: 14px;
        }
        .breadcrumbs a {
            color: #a8dadc;
            text-decoration: none;
            cursor: pointer;
        }
        .breadcrumbs a:hover {
            color: #e63946;
            text-decoration: underline;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .book-card {
            background: #0f3460;
            border-radius: 14px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }
        .book-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }
        .book-cover {
            width: 100%;
            height: 280px;
            object-fit: contain;
            background: #fff;
            padding: 8px;
        }
        .book-body {
            padding: 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .book-title {
            color: #f1faee;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        .book-meta {
            color: #a8dadc;
            font-size: 13px;
            margin-bottom: 6px;
        }
        .book-meta span {
            display: inline-block;
            margin-right: 10px;
        }
        .book-desc {
            color: #888;
            font-size: 13px;
            margin-bottom: 14px;
            flex: 1;
        }
        .book-btn {
            background: #e63946;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            display: block;
            transition: background 0.3s;
        }
        .book-btn:hover {
            background: #c62828;
            text-decoration: none;
            color: #fff;
        }
        .empty-msg {
            text-align: center;
            color: #a8dadc;
            font-size: 18px;
            margin-top: 40px;
            grid-column: 1 / -1;
        }

        @media (max-width: 600px) {
            .class-grid { grid-template-columns: repeat(3, 1fr); }
            .subject-grid { grid-template-columns: repeat(2, 1fr); }
            .books-grid { grid-template-columns: 1fr; }
            .book-card { max-width: 100%; }
        }
    </style>
</head>
<body>
    <input type="checkbox" id="menu-toggle" class="menu-checkbox">
    <label for="menu-toggle" class="menu-toggle">
        <span></span><span></span><span></span>
    </label>

    <nav class="sidebar">
        <div class="sidebar-title">Меню</div>
        <a href="../index.html">Главная</a>
        <a href="../Komorium/index.html">Komorium</a>
        <a href="index.html">📚 Kompanion</a>
        <a href="../about.html">О проекте</a>
        <button class="theme-toggle-btn" id="themeToggle">
            <span class="icon">🌙</span>
            <span>Тёмная тема</span>
        </button>
    </nav>

    <label for="menu-toggle" class="overlay"></label>
    <button class="back-to-top" id="backToTop">↑</button>

    <main>
        <h1 style="text-align: center;">📚 Kompanion</h1>
        <p style="text-align: center; color: #a8dadc; margin-bottom: 8px;">Библиотека школьных учебников</p>

        <div class="breadcrumbs" id="breadcrumbs">
            <a onclick="showAllClasses()">🏠 Все классы</a>
        </div>

        <div class="class-grid" id="classGrid"></div>
        <div class="subject-grid" id="subjectGrid" style="display: none;"></div>
        <div class="books-grid" id="booksGrid" style="display: none;"></div>
        <div class="empty-msg" id="emptyMsg" style="display: none;">📭 Пока ничего не найдено</div>
    </main>

    <footer class="footer">
        <p>© 2026 Komorok</p>
    </footer>

    <script src="../script.js"></script>
    <script>
        const subjectIcons = {
            "Биология": "🧬", "Математика": "📐", "Русский язык": "📝",
            "Литература": "📖", "История": "🏛️", "География": "🌍",
            "Алгебра": "🔢", "Геометрия": "📏", "Физика": "⚡",
            "Химия": "🧪", "Обществознание": "👥", "Информатика": "💻"
        };

        let booksData = {};
        let classes = [];
        let currentClass = null;
        let currentSubject = null;

        // Загружаем данные из JSON-файла
        fetch('books.json')
            .then(response => response.json())
            .then(data => {
                booksData = data;
                classes = Object.keys(booksData).sort((a, b) => parseInt(a) - parseInt(b));
                renderClasses();
            })
            .catch(err => {
                console.error('Ошибка загрузки books.json:', err);
                document.getElementById('emptyMsg').style.display = 'block';
                document.getElementById('emptyMsg').textContent = '❌ Не удалось загрузить каталог учебников';
            });

        function showAllClasses() {
            currentClass = null;
            currentSubject = null;
            document.getElementById('classGrid').style.display = 'grid';
            document.getElementById('subjectGrid').style.display = 'none';
            document.getElementById('booksGrid').style.display = 'none';
            document.getElementById('emptyMsg').style.display = 'none';
            document.getElementById('breadcrumbs').innerHTML = '<a onclick="showAllClasses()">🏠 Все классы</a>';
        }

        function selectClass(cls) {
            currentClass = cls;
            currentSubject = null;
            document.getElementById('classGrid').style.display = 'none';
            document.getElementById('booksGrid').style.display = 'none';
            document.getElementById('emptyMsg').style.display = 'none';
            document.getElementById('breadcrumbs').innerHTML = 
                '<a onclick="showAllClasses()">🏠 Все классы</a> → <strong>' + cls + '</strong>';

            const subjects = Object.keys(booksData[cls]);
            const grid = document.getElementById('subjectGrid');
            grid.style.display = 'grid';
            grid.innerHTML = subjects.map(sub => `
                <div class="subject-card" onclick="selectSubject('${sub}')">
                    <span class="subj-icon">${subjectIcons[sub] || '📚'}</span>
                    ${sub}
                </div>
            `).join('');
        }

        function selectSubject(sub) {
            currentSubject = sub;
            document.getElementById('subjectGrid').style.display = 'none';
            document.getElementById('breadcrumbs').innerHTML = 
                '<a onclick="showAllClasses()">🏠 Все классы</a> → <a onclick="selectClass(\'' + currentClass + '\')">' + currentClass + '</a> → <strong>' + sub + '</strong>';
            renderBooks();
        }

        function renderBooks() {
            const grid = document.getElementById('booksGrid');
            const emptyMsg = document.getElementById('emptyMsg');
            const books = booksData[currentClass]?.[currentSubject] || [];

            if (books.length === 0) {
                grid.style.display = 'none';
                emptyMsg.style.display = 'block';
                return;
            }

            emptyMsg.style.display = 'none';
            grid.style.display = 'grid';
            grid.innerHTML = books.map(book => `
                <div class="book-card">
                    <img class="book-cover" src="${book.cover || '../logo.png'}" alt="${book.title}" onerror="this.src='../logo.png'">
                    <div class="book-body">
                        <div class="book-title">${book.title}</div>
                        <div class="book-meta">
                            <span>✍️ ${book.author}</span>
                            <span>📅 ${book.year}</span>
                        </div>
                        <div class="book-meta">🏢 ${book.publisher}</div>
                        <div class="book-desc">${book.desc || ''}</div>
                        <a href="${book.url}" target="_blank" class="book-btn">📖 Открыть учебник</a>
                    </div>
                </div>
            `).join('');
        }

        function renderClasses() {
            const grid = document.getElementById('classGrid');
            grid.innerHTML = classes.map(cls => `
                <div class="class-card" onclick="selectClass('${cls}')">
                    <span class="class-icon">📚</span>
                    ${cls}
                </div>
            `).join('');
        }
    </script>
</body>
</html>
