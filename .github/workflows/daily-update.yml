name: Обновление списка статей и счётчиков

on:
  push:
    paths:
      - 'Komorium/**'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Обновление списка статей (articles.json)
        run: python scripts/update_articles_list.py

      - name: Обновление счётчика статей на главной
        run: python scripts/count_articles.py

      - name: Обновление счётчика дней
        run: python scripts/update_stats.py

      - name: Коммит и пуш изменений
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Komorium/articles.json index.html sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Автообновление списка статей и счётчиков" && git push)