name: Ежедневное обновление счётчиков и sitemap

on:
  push:
    paths:
      - 'Komorium/**'
      - 'index.html'
      - 'scripts/**'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Клонировать репозиторий
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Обновить счётчик дней на сайте
        run: python scripts/update_days.py

      - name: Обновить счётчик статей
        run: python scripts/count_articles.py

      - name: Сгенерировать sitemap.xml
        run: python scripts/generate_sitemap.py

      - name: Проверить, есть ли изменения
        id: changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Закоммитить и запушить
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🤖 Автообновление: счётчики, sitemap"
          git pull --rebase origin main
          git push