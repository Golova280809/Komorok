name: Ежедневное обновление счётчиков, статей и карты сайта

on:
  push:
    paths:
      - 'Komorium/**'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Обновление счётчика дней
        run: python scripts/update_stats.py

      - name: Обновление счётчика статей
        run: python scripts/count_articles.py

      - name: Обновление списка статей (articles.json)
        run: python scripts/update_articles_list.py

      - name: Генерация sitemap.xml
        run: python scripts/generate_sitemap.py

      
      - name: Коммит и пуш изменений
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html Komorium/articles.json sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Автообновление счётчиков, статей, sitemap" && git push)

      - name: Пинг Google о новом sitemap
        run: curl -s -o /dev/null "https://www.google.com/ping?sitemap=https://komorok.ru/sitemap.xml"
