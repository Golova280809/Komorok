name: Автоформатирование кода

on:
  workflow_dispatch:   # Можно запускать вручную
  # schedule:
  #   - cron: '0 4 * * 0'  # По желанию: раз в неделю

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Разрешаем коммитить изменения

    steps:
      - name: Клонировать репозиторий
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Установить Prettier
        run: npm install -g prettier

      - name: Отформатировать HTML, CSS, JS
        run: prettier --write "**/*.html" "**/*.css" "**/*.js"

      - name: Создать коммит с изменениями
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Автоформатирование кода (Prettier)"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"