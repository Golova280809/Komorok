name: Ручная конвертация в WebP

on:
  workflow_dispatch:   # только вручную, по кнопке

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # чтобы пушить изменения

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить Pillow
        run: pip install Pillow

      - name: Запустить конвертацию
        run: python scripts/convert_to_webp.py

      - name: Коммит и пуш WebP-файлов
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add img/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Ручная конвертация в WebP" && git push)