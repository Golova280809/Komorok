name: Ежемесячная проверка ссылок и создание Issue

on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Клонировать код
        uses: actions/checkout@v4

      - name: Проверить битые ссылки на сайте
        id: linkcheck
        continue-on-error: true
        run: |
          npx linkinator https://komorok.ru --format markdown > linkinator-report.md 2>&1
          cat linkinator-report.md

      - name: Создать Issue с отчётом об ошибках
        if: steps.linkcheck.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('./linkinator-report.md', 'utf8');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Битые ссылки на Komorok от ${new Date().toLocaleDateString('ru-RU')}`,
              body: `## 🤖 Автоматический отчёт о проверке ссылок\n\n**Сайт:** https://komorok.ru\n**Дата проверки:** ${new Date().toLocaleString('ru-RU')}\n\n### 📋 Найденные проблемы:\n${report}\n\n---\n*Этот Issue создан автоматически с помощью GitHub Actions.*`,
              labels: ['bug', 'automated-report']
            });

            console.log(`Issue создан: ${issue.data.html_url}`);