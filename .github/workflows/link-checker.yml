name: Ежемесячная проверка ссылок и создание Issue

on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Клонировать код
        uses: actions/checkout@v4

      - name: Проверить битые ссылки на сайте
        id: linkcheck
        uses: JustinBeckwith/linkinator-action@v1
        with:
          paths: https://komorok.ru
          markdown: true
          linksToSkip: "mailto:*"
        continue-on-error: true

      - name: Создать Issue с отчётом об ошибках
        if: steps.linkcheck.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const report = `Результаты проверки ссылок:\n\n${process.env.LINKINATOR_RESULT || 'Подробности в логах workflow'}`;
            
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Битые ссылки на Komorok от ${new Date().toLocaleDateString('ru-RU')}`,
              body: `## 🤖 Автоматический отчёт о проверке ссылок\n\n**Сайт:** https://komorok.ru\n**Дата проверки:** ${new Date().toLocaleString('ru-RU')}\n\n${report}\n\n---\n*Этот Issue создан автоматически с помощью GitHub Actions.*`,
              labels: ['bug', 'automated-report']
            });

            console.log(`Issue создан: ${issue.data.html_url}`);