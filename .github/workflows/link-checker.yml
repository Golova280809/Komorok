name: Быстрая проверка ссылок и красивый Issue

on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Клонировать код
        uses: actions/checkout@v4

      - name: Скачать sitemap и извлечь URL
        run: |
          curl -s https://komorok.ru/sitemap.xml -o sitemap.xml
          grep -oP '(?<=<loc>)[^<]+' sitemap.xml > urls.txt
          echo "Найдено $(wc -l < urls.txt) страниц для проверки"

      - name: Проверить битые ссылки (только страницы из sitemap)
        id: linkcheck
        continue-on-error: true
        run: |
          npx linkinator --format CSV --concurrency 10 --timeout 5000 --skip '.*\.(png|jpg|css|js|ico).*' $(cat urls.txt) > linkinator-report.csv 2>&1
          cat linkinator-report.csv

      - name: Создать Issue с красивой таблицей
        if: steps.linkcheck.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: 🚨 Битые ссылки на Komorok от ${{ github.event.repository.updated_at }}
          content-filepath: ./linkinator-report.csv
          labels: |
            bug
            automated-report