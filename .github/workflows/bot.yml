name: Telegram Bot Runner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # разрешаем коммитить изменения

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install python-telegram-bot requests

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python scripts/bot.py

      # НОВЫЙ ШАГ: сохраняем файлы в репозиторий
      - name: Commit and push collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contest.json feedbacks.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Обновлены ответы конкурса и отзывы" && git push)