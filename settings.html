<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="style.css">
    <title>Настройки — Komorok</title>
    <style>
        .settings-container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--bg-surface);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .font-size-slider {
            width: 100%;
            margin: 1rem 0;
        }
        .font-size-value {
            display: block;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0.5rem 0;
            color: var(--accent);
        }
        .preview-text {
            padding: 1rem;
            background: var(--bg-body);
            border-radius: 8px;
            margin: 1rem 0;
            transition: font-size 0.2s;
        }
    </style>
</head>
<body>
    <input type="checkbox" id="menu-toggle" class="menu-checkbox">
    <label for="menu-toggle" class="menu-toggle">
        <span></span><span></span><span></span>
    </label>

    <nav class="sidebar">
        <div class="sidebar-title">Меню</div>
        <a href="index.html">Главная</a>
        <a href="Komorium/index.html">Komorium</a>
        <a href="about.html">О проекте</a>
        <a href="settings.html">⚙️ Настройки</a>
        <button class="theme-toggle-btn" id="themeToggle">
            <span class="icon">🌙</span>
            <span>Тёмная тема</span>
        </button>
    </nav>

    <label for="menu-toggle" class="overlay"></label>
    <button class="back-to-top" id="backToTop">↑</button>

    <main>
        <div class="settings-container">
            <h2 style="text-align: center;">⚙️ Настройки</h2>

            <h3>🔤 Размер шрифта</h3>
            <p>Выберите комфортный размер текста (применяется ко всем страницам)</p>

            <input type="range" id="fontSizeSlider" class="font-size-slider" min="80" max="150" step="10" value="100">
            <span class="font-size-value" id="fontSizeLabel">100%</span>

            <div class="preview-text" id="previewText">
                <p>Это пример текста. Здесь показано, как будет выглядеть контент с выбранным размером шрифта.</p>
                <p>Вы можете изменить настройки в любое время.</p>
            </div>

            <button id="resetSettings" style="display:block; margin:1.5rem auto 0; padding:0.7rem 1.5rem; border:none; border-radius:25px; background:var(--accent); color:white; cursor:pointer; font-weight:600;">Сбросить настройки</button>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        (function() {
            const slider = document.getElementById('fontSizeSlider');
            const label = document.getElementById('fontSizeLabel');
            const preview = document.getElementById('previewText');
            const resetBtn = document.getElementById('resetSettings');

            // Восстановить сохранённое значение или 100%
            const saved = localStorage.getItem('fontSize');
            const initial = saved ? parseInt(saved) : 100;
            slider.value = initial;
            label.textContent = initial + '%';
            preview.style.fontSize = (initial / 100) + 'rem';

            // Применять при изменении слайдера (превью)
            slider.addEventListener('input', function() {
                const val = parseInt(this.value);
                label.textContent = val + '%';
                preview.style.fontSize = (val / 100) + 'rem';
            });

            // Сохранить и применить ко всему сайту при отпускании слайдера
            slider.addEventListener('change', function() {
                const val = parseInt(this.value);
                localStorage.setItem('fontSize', val);
                // Установить глобальную CSS-переменную
                document.documentElement.style.setProperty('--font-size-multiplier', (val / 100).toString());
                // Перезагрузить страницу для применения ко всем элементам
                location.reload();
            });

            // Сброс
            resetBtn.addEventListener('click', function() {
                localStorage.removeItem('fontSize');
                slider.value = 100;
                label.textContent = '100%';
                preview.style.fontSize = '1rem';
                document.documentElement.style.removeProperty('--font-size-multiplier');
                setTimeout(() => location.reload(), 100);
            });
        })();
    </script>
</body>
</html>
