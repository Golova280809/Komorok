<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" href="../../logo.webp">
    <link rel="icon" type="image/png" href="../../logo.webp">

    <meta name="description" content="Все статьи о деревне Базаново: география, река Гуньгунжда, интервью, Гражданская война.">
    <meta name="keywords" content="Базаново, статьи, Гуньгунжда, Валентина Рыбкина, Семёнов">
    <link rel="canonical" href="https://komorok.ru/Komorium/bazanovo/bazanovo.html">

    <meta property="og:title" content="Базаново — все статьи | Komorok">
    <meta property="og:description" content="Деревня Базаново и всё, что с ней связано: природа, люди, история.">
    <meta property="og:url" content="https://komorok.ru/Komorium/bazanovo/bazanovo.html">
    <meta property="og:image" content="https://komorok.ru/img/no-img.webp">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Komorok">

    <script>
        (function() {
            var theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark-theme');
            }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../common.css">
    <link rel="stylesheet" href="../komorium.css">
    <title>Базаново — все статьи | Komorok</title>
</head>
<body>
    <input type="checkbox" id="menu-toggle" class="menu-checkbox">
    <label for="menu-toggle" class="menu-toggle">
        <span></span><span></span><span></span>
    </label>

    <nav class="sidebar">
        <div class="sidebar-title">Меню</div>
        <a href="../../index.html">Главная</a>
        <a href="../index.html">Komorium</a>
        <a href="../../about.html">О проекте</a>
        <button class="theme-toggle-btn" id="themeToggle">
            <span class="icon">🌙</span>
            <span>Тёмная тема</span>
        </button>
    </nav>

    <label for="menu-toggle" class="overlay"></label>
    <header>
        <h1>🏡 Базаново</h1>
        <p>Деревня в Забайкалье и всё, что с ней связано</p>
    </header>
    <button class="back-to-top" id="backToTop">↑</button>

    <main>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск по названию или описанию..." autocomplete="off">
            <button id="clearSearch" class="search-clear" aria-label="Очистить">✕</button>
        </div>

        <!-- Основная статья -->
        <section class="category-section">
            <h2>📖 Основная статья</h2>
            <div class="articles-grid" id="cards-main"></div>
        </section>

        <!-- Природа -->
        <section class="category-section">
            <h2>🌿 Природа</h2>
            <div class="articles-grid" id="cards-nature"></div>
        </section>

        <!-- Голоса -->
        <section class="category-section">
            <h2>👥 Голоса Базаново</h2>
            <div class="articles-grid" id="cards-voices"></div>
        </section>

        <!-- Гражданская война -->
        <section class="category-section">
            <h2>⚔️ Гражданская война</h2>
            <div class="articles-grid" id="cards-civil-war"></div>
            <button class="show-more-btn" data-category="civil-war" style="display:none;">Показать ещё</button>
        </section>

        <div id="noResultsMessage" class="no-results-message">🔎 Ничего не найдено. Попробуйте изменить запрос.</div>
    </main>
    <footer class="footer">
        <p>© 2026 Komorok</p>
    </footer>
    <script src="../../script.js"></script>

    <!-- Динамическая загрузка -->
    <script>
        (function () {
            const BATCH_SIZE = 5;
            const state = {};

            fetch('../articles.json')
                .then(res => res.json())
                .then(articles => {
                    // Основная статья Базаново (категория villages)
                    const mainArticle = articles.find(a => a.url === 'bazanovo/');
                    if (mainArticle) {
                        const container = document.getElementById('cards-main');
                        const imgSrc = mainArticle.image || '../../img/no-img.png';
                        container.innerHTML = `
                            <a href="index.html" class="article-card">
                                <img src="${imgSrc}" alt="" class="avatar">
                                <div class="card-content">
                                    <span class="card-title">Деревня: Базаново</span>
                                    <span class="card-desc">География, население, история</span>
                                </div>
                            </a>`;
                    }

                    // Остальные категории
                    const categories = ['nature', 'voices', 'civil-war'];
                    categories.forEach(cat => {
                        const items = articles.filter(a => a.category === cat);
                        if (items.length === 0) return;
                        const container = document.getElementById(`cards-${cat}`);
                        if (!container) return;
                        state[cat] = 0;
                        renderBatch(items, container, document.querySelector(`[data-category="${cat}"]`), cat);
                    });
                })
                .catch(err => console.error('Ошибка загрузки articles.json', err));

            function renderBatch(items, container, btn, cat) {
                const start = state[cat];
                const batch = items.slice(start, start + BATCH_SIZE);
                batch.forEach(item => {
                    const imgSrc = item.image || '../../img/no-img.png';
                    const a = document.createElement('a');
                    a.href = item.url;
                    a.className = 'article-card';
                    a.setAttribute('data-title', item.title);
                    a.setAttribute('data-desc', '');
                    a.innerHTML = `
                        <img src="${imgSrc}" alt="" class="avatar">
                        <div class="card-content">
                            <span class="card-title">${item.title}</span>
                            <span class="card-desc"></span>
                        </div>`;
                    container.appendChild(a);
                });
                state[cat] += batch.length;
                if (btn) {
                    if (state[cat] < items.length) {
                        btn.style.display = 'block';
                        btn.onclick = () => renderBatch(items, container, btn, cat);
                    } else {
                        btn.style.display = 'none';
                    }
                }
            }
        })();
    </script>
</body>
</html>
