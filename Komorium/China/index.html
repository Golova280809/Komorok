<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" href="../../logo.png" />
    <link rel="icon" type="image/png" href="../../logo.png" />

    <meta name="description" content="Китай — статьи о культуре и истории Поднебесной в энциклопедии Komorium." />
    <meta name="keywords" content="Китай, культура Китая, история Китая, Komorium, энциклопедия" />
    <link rel="canonical" href="https://komorok.ru/Komorium/China/" />

    <meta property="og:title" content="Китай — Komorium" />
    <meta property="og:description" content="Культура и история Китая: от первого императора до последней династии." />
    <meta property="og:url" content="https://komorok.ru/Komorium/China/" />
    <meta property="og:image" content="https://komorok.ru/img/china.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Komorok" />

    <script>
        (function () {
            var theme = localStorage.getItem("theme");
            if (theme === "dark") {
                document.documentElement.classList.add("dark-theme");
            }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../common.css" />
    <link rel="stylesheet" href="../komorium.css" />
    <title>Китай — Komorium</title>
</head>
<body>
    <input type="checkbox" id="menu-toggle" class="menu-checkbox" />
    <label for="menu-toggle" class="menu-toggle">
        <span></span><span></span><span></span>
    </label>

    <nav class="sidebar">
        <div class="sidebar-title">Меню</div>
        <a href="../../index.html">Главная</a>
        <a href="../index.html">Komorium</a>
        <a href="../../about.html">О проекте</a>
        <button class="theme-toggle-btn" id="themeToggle">
            <span class="icon">🌙</span>
            <span>Тёмная тема</span>
        </button>
    </nav>

    <label for="menu-toggle" class="overlay"></label>
    <header>
        <h1>🇨🇳 Китай</h1>
        <p>Культура и история Поднебесной</p>
    </header>
    <button class="back-to-top" id="backToTop">↑</button>

    <main>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск по названию или описанию..." autocomplete="off" />
            <button id="clearSearch" class="search-clear" aria-label="Очистить">✕</button>
        </div>

        <section class="category-section">
            <h2>🎎 Культура Китая</h2>
            <div class="articles-grid" id="cards-china-culture"></div>
            <button class="show-more-btn" data-category="china-culture" style="display:none;">Показать ещё</button>
        </section>

        <section class="category-section">
            <h2>📜 История Китая</h2>
            <div class="articles-grid" id="cards-china-history"></div>
            <button class="show-more-btn" data-category="china-history" style="display:none;">Показать ещё</button>
        </section>

        <div id="noResultsMessage" class="no-results-message">🔎 Ничего не найдено. Попробуйте изменить запрос.</div>
    </main>
    <footer class="footer">
        <p>© 2026 Komorok</p>
    </footer>
    <script src="../../script.js"></script>

    <!-- Динамическая загрузка карточек -->
    <script>
        (function () {
            const BATCH_SIZE = 5;
            const state = {};

            fetch('../articles.json')
                .then(res => res.json())
                .then(articles => {
                    const groups = {};
                    articles.forEach(a => {
                        if (a.category === 'china-culture' || a.category === 'china-history') {
                            if (!groups[a.category]) groups[a.category] = [];
                            groups[a.category].push(a);
                        }
                    });

                    Object.entries(groups).forEach(([cat, items]) => {
                        const container = document.getElementById(`cards-${cat}`);
                        const btn = document.querySelector(`.show-more-btn[data-category="${cat}"]`);
                        if (!container) return;
                        state[cat] = 0;
                        renderBatch(items, container, btn, cat);
                    });
                })
                .catch(err => console.error('Ошибка загрузки articles.json', err));

            function renderBatch(items, container, btn, cat) {
                const start = state[cat];
                const batch = items.slice(start, start + BATCH_SIZE);
                batch.forEach(item => {
                    // Берём исходный путь или заглушку
                    let rawImg = item.image && item.image.trim() !== '' ? item.image : '../../img/no-img.png';
                    // Если путь начинается с ../img/, заменяем на ../../img/ для страниц второго уровня
                    const imgSrc = rawImg.startsWith('../img/') ? rawImg.replace('../img/', '../../img/') : rawImg;

                    const a = document.createElement('a');
                    a.href = item.url;
                    a.className = 'article-card';
                    a.setAttribute('data-title', item.title);
                    a.setAttribute('data-desc', '');
                    a.innerHTML = `
                        <img src="${imgSrc}" alt="" class="avatar">
                        <div class="card-content">
                            <span class="card-title">${item.title}</span>
                            <span class="card-desc"></span>
                        </div>`;
                    container.appendChild(a);
                });
                state[cat] += batch.length;

                const oldBtn = container.querySelector('.show-more-btn');
                if (oldBtn) oldBtn.remove();

                if (state[cat] < items.length) {
                    const btnNew = document.createElement('button');
                    btnNew.textContent = 'Показать ещё';
                    btnNew.className = 'show-more-btn';
                    btnNew.addEventListener('click', () => renderBatch(items, container, btnNew, cat));
                    container.appendChild(btnNew);
                }
            }
        })();
    </script>
</body>
</html>
